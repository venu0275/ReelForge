name: Build super resolution model
# Run by hand once. Converts the official Real-ESRGAN (BSD-3) weights to LiteRT and commits the
# .tflite to app/src/main/assets, where the app loads it from.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install converter
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ai-edge-torch || pip install litert-torch
          pip install ai-edge-litert || true
      - name: Convert
        run: |
          mkdir -p out
          python tools/models/convert_sr.py out
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: super-resolution-model
          path: out/*.tflite
      - name: Add the model to the app
        run: |
          cp out/super_resolution_x4.tflite app/src/main/assets/super_resolution_x4.tflite
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/super_resolution_x4.tflite
          git commit -m "Add the Super Resolution model (Real-ESRGAN general-x4v3, BSD-3, converted to LiteRT)" || exit 0
          git push
