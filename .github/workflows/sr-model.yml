name: Build super resolution model
# Run by hand once. Converts the official Real-ESRGAN (BSD-3) weights to LiteRT and uploads the
# .tflite as a build artifact, to be copied into app/src/main/assets.
on:
  workflow_dispatch:
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install converter
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ai-edge-torch || pip install litert-torch
          pip install ai-edge-litert || true
      - name: Convert
        run: |
          mkdir -p out
          python tools/models/convert_sr.py out
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: super-resolution-model
          path: out/*.tflite
