name: Android build

# Runs only when started by hand (Actions tab > Android build > Run workflow),
# so pushes do not use up GitHub Actions minutes.
# The slow emulator tests are off unless the box is ticked when starting the run.
on:
  workflow_dispatch:
    inputs:
      run_emulator_tests:
        description: "Also run the emulator tests (slow, about 15 minutes)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Print unit test timings
        if: always()
        run: grep -rh "PERF" app/build/test-results/testDebugUnitTest/*.xml || true
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: ReelForge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        timeout-minutes: 5
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  device-tests:
    if: ${{ inputs.run_emulator_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /
      - name: Run tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 3072M
          ram-size: 3072M
          cores: 2
          disable-animations: true
          script: |
            adb logcat -G 32M
            adb logcat -c
            timeout 1500 ./gradlew connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.notClass=com.reelforge.editor.ScreenshotTest || touch tests-failed
            ./gradlew --stop || true
            timeout 600 ./gradlew connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.reelforge.editor.ScreenshotTest || timeout 600 ./gradlew connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.reelforge.editor.ScreenshotTest || touch tests-failed
            timeout 120 adb logcat -d -s ReelForgeTest:V TestRunner:I || true
            mkdir -p screenshots
            timeout 120 adb pull /sdcard/Pictures/ReelForgeTest/. screenshots/ || true
            test ! -f tests-failed
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          ls -la screenshots || exit 0
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-screenshots
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        timeout-minutes: 5
        if: always()
        with:
          name: screenshots
          path: screenshots/
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        timeout-minutes: 5
        if: always()
        with:
          name: device-test-report
          path: app/build/reports/androidTests/
